# Headless Service (clusterIP: None). It has no virtual IP and doesn't load
# balance. Its job is DNS: together with the StatefulSet's serviceName, it
# gives every pod its own stable name, e.g.
#   quorum-0.quorum-headless.quorum.svc.cluster.local
# Raft stores these names in its membership list. Pod IPs change on every
# restart, but these names don't.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quorum.headless" . }}
  labels:
    {{- include "quorum.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Publish DNS records even for pods that aren't Ready yet. This is
  # essential: a pod is Ready (/readyz) only once it knows a leader, and a
  # leader can only be elected if the pods can reach each other by name.
  # Without this, unready pods would lose their DNS names, so they couldn't
  # elect a leader, so they would never become ready (on a cold start, or
  # after a majority of pods restarts).
  publishNotReadyAddresses: true
  selector:
    {{- include "quorum.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.httpPort }}
      targetPort: http
    - name: raft
      port: {{ .Values.raftPort }}
      targetPort: raft
