---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: quorumclusters.quorum.momoelbn.github.io
spec:
  group: quorum.momoelbn.github.io
  names:
    kind: QuorumCluster
    listKind: QuorumClusterList
    plural: quorumclusters
    shortNames:
    - qc
    singular: quorumcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.leader
      name: Leader
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          QuorumCluster is a Raft-replicated key-value store (quorum-server)
          managed by the quorum operator.

          The name prefixes pod and Service names ("<name>-headless", "<name>-0"),
          which Kubernetes limits to 63 characters, so keep it short.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: QuorumClusterSpec is what the user asks for.
            properties:
              image:
                description: |-
                  Image is the quorum-server container image, e.g. "quorum-server:dev".
                  Changing it triggers a rolling update, one pod at a time.
                minLength: 1
                type: string
              replicas:
                default: 3
                description: |-
                  Replicas is the number of Raft nodes. Use an odd number: 3 nodes
                  survive 1 failure, 5 survive 2.

                  It can't be changed after creation yet: adding or removing nodes
                  also needs Raft membership changes (POST /join and /remove), which
                  the operator doesn't do yet. The rule below makes the API server
                  reject the change, instead of leaving Raft with members that no
                  longer exist.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: replicas can't be changed yet (Raft membership changes
                    aren't automated)
                  rule: self == oldSelf
              storageSize:
                anyOf:
                - type: integer
                - type: string
                default: 1Gi
                description: |-
                  StorageSize is the size of each node's volume (Raft log, vote and
                  snapshots).

                  It can't be changed after creation: a StatefulSet's
                  volumeClaimTemplates are immutable in Kubernetes.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
                x-kubernetes-validations:
                - message: storageSize can't be changed after creation
                  rule: self == oldSelf
            required:
            - image
            - replicas
            - storageSize
            type: object
          status:
            description: |-
              QuorumClusterStatus is what the operator observed. Only the operator
              writes it.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes way to report state, so
                  tools like `kubectl wait --for=condition=Available` work.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              leader:
                description: |-
                  Leader is the node ID of the current Raft leader, e.g. "quorum-0".
                  Empty while there is no leader.
                type: string
              members:
                description: |-
                  Members are the node IDs in the Raft configuration, as reported by
                  the leader.
                items:
                  type: string
                type: array
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation this status was computed
                  for. If it's lower than metadata.generation, the operator hasn't
                  caught up with the latest spec change yet.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is a one-word summary: Pending, Running, Degraded or
                  Unavailable.
                enum:
                - Pending
                - Running
                - Degraded
                - Unavailable
                type: string
              readyReplicas:
                description: ReadyReplicas is the number of pods passing their readiness
                  probe.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 50 characters
          rule: size(self.metadata.name) <= 50
    served: true
    storage: true
    subresources:
      status: {}
