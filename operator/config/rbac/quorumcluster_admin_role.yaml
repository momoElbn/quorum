# This rule is not used by the project quorum-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over quorum.momoelbn.github.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: quorum-operator
    app.kubernetes.io/managed-by: kustomize
  name: quorumcluster-admin-role
rules:
- apiGroups:
  - quorum.momoelbn.github.io
  resources:
  - quorumclusters
  verbs:
  - '*'
- apiGroups:
  - quorum.momoelbn.github.io
  resources:
  - quorumclusters/status
  verbs:
  - get
